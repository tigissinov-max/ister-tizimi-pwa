
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Істер тізімі</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2455a4">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 20px;
    }

    .panel {
      max-width: 600px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0002;
    }

    .languages {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      background: #2455a4;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    button.active {
      background: #167447;
    }

    .form {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    #taskInput {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 6px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    li label {
      flex: 1;
      overflow-wrap: anywhere;
    }

    li input {
      margin-right: 8px;
    }

    .done {
      text-decoration: line-through;
      color: #777;
    }

    .delete {
      background: #a63636;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    .info {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="panel">

    <div class="languages">
      <button id="kkBtn"
        onclick="changeLanguage('kk')">
        Қазақша
      </button>

      <button id="ruBtn"
        onclick="changeLanguage('ru')">
        Русский
      </button>
    </div>

    <h1 id="title"></h1>

    <form id="taskForm" class="form">
      <input id="taskInput"
             required
             maxlength="200">
      <button id="addBtn" type="submit"></button>
    </form>

    <ul id="taskList"></ul>

    <p id="status"></p>
    <p id="storageInfo" class="info"></p>

  </main>

  <script>
    const words = {
      kk: {
        title: "Істер тізімі",
        placeholder: "Жаңа істі енгізіңіз",
        add: "Қосу",
        remove: "Жою",
        completed: "Орындалған істер",
        storage: "Істер осы браузерде сақталады."
      },
      ru: {
        title: "Список дел",
        placeholder: "Введите новое дело",
        add: "Добавить",
        remove: "Удалить",
        completed: "Выполнено дел",
        storage: "Дела сохраняются в этом браузере."
      }
    };

    const TASKS_KEY = "ister_tizimi_tasks_v1";
    const LANG_KEY = "ister_tizimi_lang_v1";

    let language = localStorage.getItem(LANG_KEY);

    if (language !== "kk" && language !== "ru") {
      language = "kk";
    }

    let tasks = [];

    try {
      const saved = JSON.parse(
        localStorage.getItem(TASKS_KEY) || "[]"
      );

      tasks = Array.isArray(saved) ? saved : [];
    } catch (error) {
      tasks = [];
    }

    function saveTasks() {
      localStorage.setItem(
        TASKS_KEY,
        JSON.stringify(tasks)
      );
    }

    function changeLanguage(lang) {
      language = lang;
      localStorage.setItem(LANG_KEY, lang);
      render();
    }

    function render() {
      const t = words[language];

      document.documentElement.lang = language;
      document.title = t.title;

      document.getElementById("title").textContent =
        t.title;

      document.getElementById("taskInput").placeholder =
        t.placeholder;

      document.getElementById("addBtn").textContent =
        t.add;

      document.getElementById("storageInfo").textContent =
        t.storage;

      document.getElementById("kkBtn").classList.toggle(
        "active", language === "kk"
      );

      document.getElementById("ruBtn").classList.toggle(
        "active", language === "ru"
      );

      const list = document.getElementById("taskList");
      list.replaceChildren();

      tasks.forEach(task => {
        const li = document.createElement("li");
        const checkbox = document.createElement("input");
        const label = document.createElement("label");
        const remove = document.createElement("button");

        checkbox.type = "checkbox";
        checkbox.checked = task.done;

        label.textContent = task.text;

        if (task.done) {
          label.classList.add("done");
        }

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          render();
        });

        remove.textContent = t.remove;
        remove.className = "delete";

        remove.addEventListener("click", () => {
          tasks = tasks.filter(
            item => item.id !== task.id
          );

          saveTasks();
          render();
        });

        li.append(checkbox, label, remove);
        list.appendChild(li);
      });

      const completed = tasks.filter(
        task => task.done
      ).length;

      document.getElementById("status").textContent =
        `${t.completed}: ${completed} / ${tasks.length}`;
    }

    document.getElementById("taskForm").addEventListener(
      "submit",
      event => {
        event.preventDefault();

        const input = document.getElementById("taskInput");
        const value = input.value.trim();

        if (!value) return;

        tasks.push({
          id: crypto.randomUUID(),
          text: value,
          done: false
        });

        saveTasks();
        input.value = "";
        render();
      }
    );

    render();
  </script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js")
        .then(() => {
          console.log("PWA қызметі тіркелді");
        })
        .catch(error => {
          console.error("PWA қатесі:", error);
        });
    });
  }
</script></body>
</html>
